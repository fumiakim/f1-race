<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 RACE - レトロレーサー</title>
<style>
  :root { --bezel:#2b2f38; --bezel2:#1a1d23; }
  * { box-sizing: border-box; }
  html,body {
    margin:0; padding:0; height:100%;
    background:#0b0d10;
    color:#e8e8e8;
    font-family: "Courier New", monospace;
    -webkit-font-smoothing: none;
    overflow:hidden;
  }
  #wrap {
    height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:10px;
    padding:10px;
  }
  #cabinet {
    padding:14px 14px 10px;
    border-radius:14px;
    background:linear-gradient(180deg,var(--bezel),var(--bezel2));
    box-shadow: 0 0 0 3px #000, 0 14px 40px rgba(0,0,0,.7), inset 0 2px 0 rgba(255,255,255,.05);
    max-width:96vw;
  }
  #screen-holder{
    position:relative;
    border-radius:6px;
    overflow:hidden;
    background:#000;
    box-shadow: inset 0 0 0 4px #000, inset 0 0 22px rgba(0,0,0,.9);
  }
  canvas#game {
    display:block;
    width:min(88vw, 720px);
    height:auto;
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* CRT scanline overlay */
  #screen-holder::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, rgba(0,0,0,0) 2px 4px);
    mix-blend-mode:multiply;
  }
  #screen-holder::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(120% 120% at 50% 45%, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%);
  }
  #brand{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:8px; padding:0 4px;
    color:#8b93a3; font-size:11px; letter-spacing:2px;
  }
  #brand b{ color:#e03030; }
  .keys { color:#c8ccd6; }
  #help {
    max-width:min(88vw, 720px);
    font-size:12px; line-height:1.7; color:#aeb4c0;
    text-align:center;
  }
  #help kbd{
    display:inline-block; background:#20242c; border:1px solid #3a404c;
    border-bottom-width:2px; border-radius:4px; padding:1px 6px; margin:0 1px;
    color:#fff; font-size:11px;
  }
  @media (max-width:520px){ #help{ font-size:11px; } }
</style>

<div id="wrap">
  <div id="cabinet">
    <div id="screen-holder">
      <canvas id="game" width="320" height="240"></canvas>
    </div>
    <div id="brand"><span>Ⓝ HOMAGE</span><span><b>F1</b> RACE</span><span>1984 STYLE</span></div>
  </div>
  <div id="help">
    <span class="keys"><kbd>X</kbd> アクセル　<kbd>Z</kbd> ブレーキ　<kbd>←</kbd><kbd>→</kbd> ハンドル　<kbd>Shift</kbd> ギア(LOW/HIGH)　<kbd>Enter</kbd> スタート　<kbd>M</kbd> 音</span>
  </div>
</div>

<script>
"use strict";
(function(){

// ============================================================
//  F1 RACE — ファミコン風 疑似3Dレーサー (homage / original code)
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;    // 320 内部解像度
const H = canvas.height;   // 240
ctx.imageSmoothingEnabled = false;

// ---- NES 風パレット -------------------------------------------------
const COL = {
  sky1:'#4a86e8', sky2:'#5c94fc',
  mountain:'#2c6b3a', mountainDark:'#1f4f2a',
  city:'#3a4a6b',
  grassLight:'#3aa63a', grassDark:'#2e8c2e',
  roadLight:'#8b8b8b', roadDark:'#7a7a7a',
  rumbleLight:'#e03030', rumbleWhite:'#ffffff',
  lane:'#ffffff',
  fog:'#5c94fc'
};

// ---- 疑似3D パラメータ ----------------------------------------------
const fov          = 100;
const cameraHeight = 1000;
const cameraDepth  = 1 / Math.tan((fov/2) * Math.PI/180);
const roadWidth    = 2000;                 // 路面の半幅
const segmentLength= 200;
const rumbleLength = 3;
const lanes        = 3;
const drawDistance = 260;                   // 描画セグメント数
const playerZ      = cameraHeight * cameraDepth;
const fogDensity   = 4;

// スピード関連（world units / 秒）
const step     = 1/60;
const maxSpeed = segmentLength / step;      // 上限
const gearLowMax  = maxSpeed * 0.46;
const gearHighMax = maxSpeed * 1.0;
const accelLow    = maxSpeed / 3.0;         // LOW: 加速強い
const accelHigh   = maxSpeed / 6.5;         // HIGH: 加速穏やか
const braking     = -maxSpeed / 2.4;
const decel       = -maxSpeed / 5.0;
const offDecel    = -maxSpeed / 2.6;
const offLimit    = maxSpeed / 4;
const centrifugal = 0.32;

const CAR_WORLD_W = 900;                    // ライバル車の見かけ幅(world)
const HIT_W       = 0.9;                    // 当たり判定 x（路面比）
const TOTAL_LAPS  = 3;

// ---- 状態 -----------------------------------------------------------
let segments = [];
let trackLength = 0;
let rivals = [];

let state = 'title';        // title | select | countdown | race | finish | gameover
let position = 0;
let playerX  = 0;
let speed    = 0;
let gearHigh = false;
let lap = 1;
let raceTime = 0;
let lapStart = 0;
let bestLap  = 0;
let lastLap  = 0;
let timeLeft = 65;          // 制限タイム
let countdown = 0;
let shake = 0;
let steerVis = 0;           // 見た目のハンドル傾き
let skyOffset = 0;
let finishRank = 1;
let passed = 0;             // 追い越し数
let sparks = [];            // 衝突時の火花パーティクル
let hitTimer = 0;           // 衝突ペナルティのクールダウン
let courseIndex = 0;        // 選択中のコース
let selIndex = 0;           // コース選択画面のカーソル
let trackMap = [];          // ミニマップ用のコース軌跡(正規化済み)
let courseMaps = [];        // 全コースの見取図(選択画面のプレビュー用・起動時に一度だけ計算)
let newRecord = false;      // 今回ベストラップを更新したか

// ============================================================
//  Util
// ============================================================
const U = {
  limit:(v,a,b)=>Math.max(a,Math.min(v,b)),
  toInt:(v,d)=>{ v=parseInt(v,10); return isNaN(v)?d:v; },
  interp:(a,b,p)=>a+(b-a)*p,
  accelerate:(v,acc,dt)=>v + acc*dt,
  ease:(a,b,p)=>a+(b-a)*(1-Math.cos(p*Math.PI))/2,
  percentRemaining:(n,total)=>(n%total)/total,
  project(p, camX, camY, camZ, depth, w, h, rw){
    p.camera.x = (p.world.x||0) - camX;
    p.camera.y = (p.world.y||0) - camY;
    p.camera.z = (p.world.z||0) - camZ;
    p.screen.scale = depth / p.camera.z;
    p.screen.x = Math.round((w/2) + (p.screen.scale * p.camera.x * w/2));
    p.screen.y = Math.round((h/2) - (p.screen.scale * p.camera.y * h/2));
    p.screen.w = Math.round(       (p.screen.scale * rw    * w/2));
  }
};
function findSegment(z){ const n=segments.length; return segments[((Math.floor(z/segmentLength)%n)+n)%n]; }

// ============================================================
//  トラック生成
// ============================================================
const ROAD = {
  LEN:  { NONE:0, SHORT:12, MEDIUM:24, LONG:48 },
  CURVE:{ NONE:0, EASY:2, MEDIUM:4, HARD:6 },
  HILL: { NONE:0, LOW:20, MEDIUM:40, HIGH:60 }
};

function lastY(){ return segments.length===0 ? 0 : segments[segments.length-1].p2.world.y; }

function addSegment(curve, y){
  const n = segments.length;
  const prevY = lastY();
  segments.push({
    index:n,
    p1:{ world:{y:prevY, z:n*segmentLength}, camera:{}, screen:{} },
    p2:{ world:{y:y,     z:(n+1)*segmentLength}, camera:{}, screen:{} },
    curve:curve,
    color: Math.floor(n/rumbleLength)%2 ? 'dark' : 'light',
    cars:[]
  });
}
function addRoad(enter, hold, leave, curve, y){
  const startY = lastY();
  const endY   = startY + y*segmentLength;
  const total  = enter+hold+leave;
  for(let n=0;n<enter;n++) addSegment(U.ease(0,curve,n/enter),      U.ease(startY,endY,n/total));
  for(let n=0;n<hold;n++)  addSegment(curve,                        U.ease(startY,endY,(enter+n)/total));
  for(let n=0;n<leave;n++) addSegment(U.ease(curve,0,n/leave),      U.ease(startY,endY,(enter+hold+n)/total));
}
function addStraight(len){ len=len||ROAD.LEN.MEDIUM; addRoad(len,len,len,0,0); }
function addCurve(len,curve,height){ addRoad(len,len,len,curve,height||0); }
function addHill(len,height){ addRoad(len,len,len,0,height); }
function addSCurves(){
  addRoad(ROAD.LEN.MEDIUM,ROAD.LEN.MEDIUM,ROAD.LEN.MEDIUM,-ROAD.CURVE.EASY,ROAD.HILL.NONE);
  addRoad(ROAD.LEN.MEDIUM,ROAD.LEN.MEDIUM,ROAD.LEN.MEDIUM, ROAD.CURVE.MEDIUM,ROAD.HILL.MEDIUM);
  addRoad(ROAD.LEN.MEDIUM,ROAD.LEN.MEDIUM,ROAD.LEN.MEDIUM, ROAD.CURVE.EASY,-ROAD.HILL.LOW);
  addRoad(ROAD.LEN.MEDIUM,ROAD.LEN.MEDIUM,ROAD.LEN.MEDIUM,-ROAD.CURVE.EASY, ROAD.HILL.MEDIUM);
  addRoad(ROAD.LEN.MEDIUM,ROAD.LEN.MEDIUM,ROAD.LEN.MEDIUM,-ROAD.CURVE.MEDIUM,-ROAD.HILL.MEDIUM);
}

// ---- コース定義（5種）------------------------------------------------
const L = ROAD.LEN, C = ROAD.CURVE, HL = ROAD.HILL;
const COURSES = [
  {
    id:'beginner', name:'BEGINNER', desc:'EASY / FLAT', laps:3, rivals:6, timeStart:80, timeBonus:40,
    build(){
      addStraight(L.LONG);
      addCurve(L.MEDIUM,  C.EASY,   HL.NONE);
      addStraight(L.MEDIUM);
      addCurve(L.MEDIUM, -C.EASY,   HL.NONE);
      addStraight(L.LONG);
      addCurve(L.LONG,    C.MEDIUM, HL.LOW);
      addStraight(L.MEDIUM);
      addCurve(L.MEDIUM, -C.EASY,  -HL.LOW);
      addStraight(L.LONG);
      addCurve(L.MEDIUM, -C.MEDIUM, HL.NONE);
      addStraight(L.MEDIUM);
    }
  },
  {
    id:'seaside', name:'SEASIDE', desc:'S-CURVES', laps:3, rivals:8, timeStart:75, timeBonus:35,
    build(){
      addStraight(L.MEDIUM);
      addSCurves();
      addStraight(L.SHORT);
      addCurve(L.MEDIUM,  C.MEDIUM, HL.LOW);
      addSCurves();
      addCurve(L.MEDIUM, -C.MEDIUM,-HL.LOW);
      addStraight(L.MEDIUM);
      addSCurves();
      addStraight(L.SHORT);
    }
  },
  {
    id:'mountain', name:'MOUNTAIN', desc:'HILLY', laps:3, rivals:8, timeStart:80, timeBonus:38,
    build(){
      addStraight(L.SHORT);
      addHill(L.MEDIUM,   HL.MEDIUM);
      addCurve(L.MEDIUM,  C.MEDIUM, HL.HIGH);
      addHill(L.MEDIUM,  -HL.MEDIUM);
      addCurve(L.LONG,   -C.MEDIUM, HL.MEDIUM);
      addHill(L.MEDIUM,  -HL.HIGH);
      addStraight(L.MEDIUM);
      addCurve(L.MEDIUM,  C.EASY,   HL.MEDIUM);
      addHill(L.LONG,    -HL.MEDIUM);
      addCurve(L.MEDIUM, -C.EASY,   HL.LOW);
      addStraight(L.SHORT);
    }
  },
  {
    id:'technical', name:'TECHNICAL', desc:'TIGHT TURNS', laps:3, rivals:9, timeStart:78, timeBonus:36,
    build(){
      addStraight(L.SHORT);
      addCurve(L.SHORT,   C.HARD,   HL.NONE);
      addCurve(L.SHORT,  -C.HARD,   HL.LOW);
      addStraight(L.SHORT);
      addCurve(L.SHORT,  -C.HARD,   HL.NONE);
      addCurve(L.SHORT,   C.HARD,  -HL.LOW);
      addCurve(L.MEDIUM,  C.MEDIUM, HL.NONE);
      addCurve(L.SHORT,  -C.HARD,   HL.LOW);
      addStraight(L.MEDIUM);
      addCurve(L.SHORT,   C.HARD,   HL.NONE);
      addCurve(L.SHORT,  -C.MEDIUM,-HL.LOW);
      addCurve(L.MEDIUM, -C.HARD,   HL.NONE);
      addStraight(L.SHORT);
    }
  },
  {
    id:'grandprix', name:'GRAND PRIX', desc:'LONG / HARD', laps:3, rivals:9, timeStart:95, timeBonus:45,
    build(){
      addStraight(L.SHORT);
      addHill(L.SHORT, HL.LOW);
      addCurve(L.MEDIUM,  C.MEDIUM, HL.LOW);
      addStraight(L.SHORT);
      addSCurves();
      addCurve(L.LONG,   -C.MEDIUM, HL.MEDIUM);
      addStraight(L.MEDIUM);
      addCurve(L.LONG,    C.HARD,  -HL.LOW);
      addSCurves();
      addHill(L.MEDIUM,  -HL.MEDIUM);
      addCurve(L.MEDIUM, -C.HARD,   HL.NONE);
      addStraight(L.MEDIUM);
      addCurve(L.MEDIUM,  C.EASY,   HL.LOW);
      addStraight(L.SHORT);
    }
  }
];
function course(){ return COURSES[courseIndex] || COURSES[0]; }

function buildTrack(){
  segments = [];
  course().build();

  // ループ継ぎ目の段差防止：全体を線形補正して始点・終点の標高を必ず0に揃える
  // （丘の起伏は保ったまま、周回時にコースが上下ジャンプしないようにする）
  const nseg = segments.length;
  const endY = segments[nseg-1].p2.world.y;
  for(let i=0;i<nseg;i++){
    segments[i].p1.world.y -= endY * i       / nseg;
    segments[i].p2.world.y -= endY * (i+1)   / nseg;
  }

  // スタート/フィニッシュのマーカー
  segments[Math.floor(rumbleLength/2)].marker = true;
  segments[0].marker = true;

  trackLength = segments.length * segmentLength;
  trackMap = buildTrackMap();
}

// カーブ値を積分して2Dの見取図（ミニマップ用の軌跡）を作る。
// 0..1 に正規化し、長辺を基準に中央寄せする。
function buildTrackMap(){
  const raw = [];
  const n = segments.length;
  if(!n) return [];
  const K = 0.006;                      // カーブ値→角度の係数
  // 1周でちょうど360°回るよう、不足分を全セグメントへ均等配分する。
  let sum = 0;
  for(const s of segments) sum += s.curve;
  const adjust = (Math.PI*2 - sum*K) / n;

  // 軌跡を積分する。heading=0 を画面上方向とし、右カーブ(curve>0)が
  // 画面でも右へ曲がるようにする（画面座標は下が +y なので cos を反転）。
  let heading = 0, x = 0, y = 0;
  const STEP = 4;                       // 4セグメントごとにサンプル
  raw.push({x, y});                     // 始点（スタート/フィニッシュ地点）
  for(let i=0;i<n;i++){
    heading += segments[i].curve * K + adjust;
    x += Math.sin(heading);
    y -= Math.cos(heading);
    if((i+1) % STEP === 0) raw.push({x, y});
  }
  if(raw.length < 2) return [];

  // スタートとゴールを同一地点にする：閉じ誤差を全点へ線形配分して輪を閉じる
  const ex = raw[raw.length-1].x - raw[0].x;
  const ey = raw[raw.length-1].y - raw[0].y;
  const m = raw.length - 1;
  for(let i=0;i<=m;i++){
    raw[i].x -= ex * (i/m);
    raw[i].y -= ey * (i/m);
  }
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for(const p of raw){
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  const w = Math.max(maxX-minX, 1e-6), h = Math.max(maxY-minY, 1e-6);
  const s = 1/Math.max(w,h);
  const offX = (1 - w*s)/2, offY = (1 - h*s)/2;   // 中央寄せ
  return raw.map(p=>({ x:(p.x-minX)*s + offX, y:(p.y-minY)*s + offY }));
}

function buildRivals(){
  rivals = [];
  const colors = ['#f0f030','#30c0f0','#f090d0','#ffffff','#f08020','#a060f0','#40e060','#e0e0e0'];
  const n = course().rivals || 9;
  for(let i=0;i<n;i++){
    const offset = ((i%3)-1) * 0.55;                 // 3レーン
    const z = Math.floor((trackLength/n)*i + trackLength*0.12) % trackLength;
    rivals.push({
      offset: offset,
      z: z,
      color: colors[i%colors.length],
      speed: maxSpeed * (0.30 + 0.10*((i*7)%5)/5),   // プレイヤーより遅い
      wob: (i*13)%628/100,
      prevDz: undefined                              // 追い越し判定用（前フレームの相対位置）
    });
  }
}

// ============================================================
//  ベストラップの保存 (localStorage・コース別)
// ============================================================
const LS_KEY = 'f1race.best.v1';
function loadBests(){
  try{ const o = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); return (o && typeof o==='object') ? o : {}; }
  catch(e){ return {}; }
}
function bestOf(id){ const v = loadBests()[id]; return (typeof v==='number' && v>0) ? v : 0; }
// 更新したら true を返す
function saveBest(id, t){
  if(!(t>0)) return false;
  const all = loadBests();
  if(all[id] && all[id] <= t) return false;
  all[id] = t;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(all)); }catch(e){ /* 保存不可でも進行 */ }
  return true;
}

// ============================================================
//  入力
// ============================================================
const keys = {};
const KEYMAP = {
  KeyX:'up', KeyZ:'down',                        // X=アクセル / Z=ブレーキ（ファミコン A/B ボタン風）
  ArrowUp:'up', ArrowDown:'down',                // 十字キー上下でも加減速可
  ArrowLeft:'left', ArrowRight:'right'           // 十字キー左右でハンドル
};
addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(KEYMAP[e.code]) keys[KEYMAP[e.code]] = true;

  // コース選択画面: 上下でカーソル移動
  if(state==='select'){
    if(e.code==='ArrowUp'   || e.code==='KeyW'){ selIndex=(selIndex-1+COURSES.length)%COURSES.length; sfx.blip(560,0.05); }
    if(e.code==='ArrowDown' || e.code==='KeyS'){ selIndex=(selIndex+1)%COURSES.length;                sfx.blip(560,0.05); }
  }

  if(e.code==='Enter' || e.code==='Space'){
    if(state==='title'){ state='select'; audio.ensure(); if(audio.ctx&&audio.ctx.state==='suspended') audio.ctx.resume(); sfx.blip(760,0.08); }
    else if(state==='select'){ courseIndex = selIndex; startRace(); }
    else if(state==='finish' || state==='gameover') state='select';   // 結果画面 → コース選択へ
  }
  // レース中/結果画面から選択画面へ戻る
  if(e.code==='Escape' && (state==='race'||state==='countdown'||state==='finish'||state==='gameover')){
    audio.stopEngine(); state='select';
  }
  if(e.code==='ShiftLeft' || e.code==='ShiftRight'){
    if(state==='race'){ gearHigh = !gearHigh; sfx.gear(); }
  }
  if(e.code==='KeyM'){ audio.muted = !audio.muted; if(audio.muted) audio.stopEngine(); }
}, {passive:false});
addEventListener('keyup', e=>{ if(KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });

// タッチ操作（簡易・画面をタップで進む）
canvas.addEventListener('pointerdown', ()=>{
  if(state==='title'){ state='select'; audio.ensure(); if(audio.ctx&&audio.ctx.state==='suspended') audio.ctx.resume(); }
  else if(state==='select'){ courseIndex = selIndex; startRace(); }
  else if(state==='finish' || state==='gameover') state='select';
});

// ============================================================
//  サウンド (Web Audio, 依存なし)
// ============================================================
const audio = {
  ctx:null, muted:false, engine:null, engGain:null, lfo:null,
  ensure(){
    if(this.ctx) return;
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; }
  },
  startEngine(){
    if(!this.ctx || this.muted || this.engine) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type='sawtooth'; o.frequency.value=60;
    g.gain.value=0.0;
    o.connect(g); g.connect(this.ctx.destination); o.start();
    this.engine=o; this.engGain=g;
  },
  stopEngine(){
    if(this.engine){ try{this.engine.stop();}catch(e){} this.engine=null; this.engGain=null; }
  },
  update(sp){
    if(!this.engine||!this.ctx) return;
    const p = sp/maxSpeed;
    this.engine.frequency.setTargetAtTime(55 + p*230 + (gearHigh?40:0), this.ctx.currentTime, 0.05);
    this.engGain.gain.setTargetAtTime(this.muted?0:(0.02+p*0.05), this.ctx.currentTime, 0.1);
  }
};
const sfx = {
  blip(freq,dur,type){
    if(!audio.ctx||audio.muted) return;
    const o=audio.ctx.createOscillator(), g=audio.ctx.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.value=0.06; g.gain.exponentialRampToValueAtTime(0.0001, audio.ctx.currentTime+dur);
    o.connect(g); g.connect(audio.ctx.destination); o.start(); o.stop(audio.ctx.currentTime+dur);
  },
  gear(){ this.blip(220,0.08,'square'); },
  crash(){
    if(!audio.ctx||audio.muted) return;
    const dur=0.35, sr=audio.ctx.sampleRate;
    const buf=audio.ctx.createBuffer(1, sr*dur, sr), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const src=audio.ctx.createBufferSource(); src.buffer=buf;
    const g=audio.ctx.createGain(); g.gain.value=0.25;
    src.connect(g); g.connect(audio.ctx.destination); src.start();
  },
  count(hi){ this.blip(hi?660:440, 0.12, 'square'); },
  lapDone(){ this.blip(523,0.1); setTimeout(()=>this.blip(784,0.14),110); }
};

// ============================================================
//  ゲーム進行
// ============================================================
function startRace(){
  audio.ensure();
  if(audio.ctx && audio.ctx.state==='suspended') audio.ctx.resume();
  buildTrack();
  buildRivals();
  position=0; playerX=0; speed=0; gearHigh=false;
  lap=1; raceTime=0; lapStart=0; bestLap=0; lastLap=0; passed=0;
  timeLeft = course().timeStart; shake=0; steerVis=0;
  sparks = []; hitTimer = 0; newRecord = false;
  countdown = 3.0;
  state='countdown';
  audio.startEngine();
}

function onLapComplete(){
  lastLap = raceTime - lapStart;
  if(bestLap===0 || lastLap<bestLap) bestLap=lastLap;
  // コース別のベストラップを保存（更新時のみ）
  if(saveBest(course().id, lastLap)) newRecord = true;
  lapStart = raceTime;
  lap++;
  timeLeft += course().timeBonus;        // ラップ完了でタイム加算
  sfx.lapDone();
  if(lap > (course().laps || TOTAL_LAPS)){
    // レース完了
    finishRank = 1 + Math.max(0, rivals.length - passed);
    state='finish';
    audio.stopEngine();
  }
}

function update(dt){
  if(state!=='race' && state!=='countdown') return;

  if(state==='countdown'){
    const prev=Math.ceil(countdown);
    countdown -= dt;
    const now=Math.ceil(countdown);
    if(now!==prev && now>=1) sfx.count(false);
    if(countdown<=0){ state='race'; sfx.count(true); lapStart=0; raceTime=0; }
    audio.update(0);
    return;
  }

  raceTime += dt;
  timeLeft -= dt;
  if(timeLeft<=0){ timeLeft=0; state='gameover'; audio.stopEngine(); sfx.crash(); return; }

  const playerSeg = findSegment(position + playerZ);
  const speedPercent = speed/maxSpeed;
  const dx = dt * 2 * speedPercent;       // ハンドル率（速いほど利く）

  // 進行 + ラップ判定
  position += dt*speed;
  while(position >= trackLength){ position -= trackLength; onLapComplete(); if(state!=='race') return; }
  while(position < 0) position += trackLength;

  // ステアリング
  let steerInput = 0;
  if(keys.left){ playerX -= dx; steerInput=-1; }
  else if(keys.right){ playerX += dx; steerInput=1; }
  steerVis = U.interp(steerVis, steerInput, Math.min(1,dt*10));

  // 遠心力
  playerX -= dx * speedPercent * playerSeg.curve * centrifugal;

  // 加減速
  const gearMax = gearHigh ? gearHighMax : gearLowMax;
  const gearAcc = gearHigh ? accelHigh   : accelLow;
  if(keys.up)        speed = U.accelerate(speed, gearAcc, dt);
  else if(keys.down) speed = U.accelerate(speed, braking, dt);
  else               speed = U.accelerate(speed, decel,   dt);

  if(speed > gearMax) speed = Math.max(gearMax, speed - maxSpeed*0.8*dt); // ギア上限で頭打ち(エンジンブレーキ)

  // オフロード
  if((playerX < -1 || playerX > 1) && speed > offLimit){
    speed = U.accelerate(speed, offDecel, dt);
    shake = Math.max(shake, 1.4);
  }

  // ライバルとの当たり判定 + 追い越しカウント
  hitTimer = Math.max(0, hitTimer - dt);
  const carW = CAR_WORLD_W/roadWidth;
  const half = trackLength/2;
  for(const r of rivals){
    // 進行
    r.z = (r.z + r.speed*dt) % trackLength;
    // 符号付き相対位置（+ = 前方 / - = 後方）を [-half, half) に正規化
    const dz = ((r.z - position + half) % trackLength + trackLength) % trackLength - half;
    // 追い越し判定: 前フレームは前方(+)、今フレームは後方(-) に変わった＝1台抜いた。
    // コース反対側での ±half 折り返しを誤検出しないよう、近距離での交差のみ数える。
    const NEAR = segmentLength*30;
    if(r.prevDz !== undefined && r.prevDz > 0 && dz <= 0 && r.prevDz < NEAR && -dz < NEAR){
      passed++; sfx.blip(880,0.05);
    }
    r.prevDz = dz;
    // 衝突: z 近接 & x 重なり
    if(hitTimer<=0 && dz < segmentLength*2.2 && dz > -segmentLength*1.2){
      if(Math.abs(playerX - r.offset) < (carW+HIT_W)/2*0.72){
        // 接触 → 火花＋著しく速度低下
        speed = Math.min(speed*0.18, r.speed*0.45);
        playerX += (playerX>=r.offset?1:-1) * 0.16;
        shake = 6.0; hitTimer = 0.35; sfx.crash();
        const hx = W/2 + steerVis*8 + U.limit(r.offset-playerX,-0.7,0.7)*46;
        spawnSparks(hx, H*0.60, 22);
      }
    }
  }

  // 火花パーティクル更新
  for(const s of sparks){ s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 520*dt; s.life -= dt; }
  if(sparks.length) sparks = sparks.filter(s=>s.life>0);

  playerX = U.limit(playerX, -2.2, 2.2);
  speed   = U.limit(speed, 0, maxSpeed);
  shake   = Math.max(0, shake - dt*6);

  // 背景パララックス
  skyOffset += playerSeg.curve * speedPercent * dt * 0.6;

  audio.update(speed);
}

// ============================================================
//  描画
// ============================================================
function render(){
  ctx.clearRect(0,0,W,H);

  // 画面シェイク
  const sx = shake ? (Math.random()*2-1)*shake : 0;
  const sy = shake ? (Math.random()*2-1)*shake : 0;
  ctx.save();
  ctx.translate(sx, sy);

  const baseSeg     = findSegment(position);
  const basePercent = U.percentRemaining(position, segmentLength);
  const playerSeg   = findSegment(position + playerZ);
  const playerPct   = U.percentRemaining(position+playerZ, segmentLength);
  const playerY     = U.interp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);

  const horizon = H/2 - (playerY/ (cameraHeight) * 0)  ; // baseは中央
  renderBackground(playerY);

  // --- 道路 ---
  let maxy = H;
  let x = 0;
  let dx = -(baseSeg.curve * basePercent);

  const visible = [];
  for(let n=0;n<drawDistance;n++){
    const seg = segments[(baseSeg.index+n)%segments.length];
    seg.looped = seg.index < baseSeg.index;
    seg.fog = fogFactor(n/drawDistance, fogDensity);
    seg.cars.length = 0;

    U.project(seg.p1, (playerX*roadWidth)-x,      playerY+cameraHeight, position-(seg.looped?trackLength:0), cameraDepth, W, H, roadWidth);
    U.project(seg.p2, (playerX*roadWidth)-x-dx,   playerY+cameraHeight, position-(seg.looped?trackLength:0), cameraDepth, W, H, roadWidth);

    x  += dx;
    dx += seg.curve;

    seg.clip = maxy;
    if(seg.p1.camera.z <= cameraDepth || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;

    renderSegment(seg);
    maxy = seg.p2.screen.y;
    visible.push(seg);
  }

  // --- ライバル車（奥→手前） ---
  const drawList = [];
  for(const r of rivals){
    let fd = ((r.z - position)%trackLength + trackLength)%trackLength;
    if(fd < drawDistance*segmentLength) drawList.push({r, fd});
  }
  drawList.sort((a,b)=>b.fd-a.fd);
  for(const d of drawList){
    const seg = findSegment(d.r.z);
    if(!seg.p1.screen || seg.p1.screen.scale===undefined) continue;
    renderRival(d.r, seg);
  }

  // --- プレイヤー車 ---
  renderPlayer();

  // --- 衝突の火花 ---
  renderSparks();

  ctx.restore();

  // --- HUD & 画面状態 ---
  renderHUD();
  if(state==='title')      renderTitle();
  if(state==='select')     renderSelect();
  if(state==='countdown')  renderCountdown();
  if(state==='finish')     renderFinish();
  if(state==='gameover')   renderGameOver();
}

function fogFactor(distance, density){
  return 1 / Math.pow(Math.E, (distance*distance*density));
}

// 背景（空・山・地平）
function renderBackground(playerY){
  const hy = Math.round(H*0.52 + playerY/8000*H); // 地平線
  // 空
  const g = ctx.createLinearGradient(0,0,0,hy);
  g.addColorStop(0, COL.sky1); g.addColorStop(1, COL.sky2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,hy);
  // 太陽
  ctx.fillStyle='#fff7c0';
  ctx.beginPath(); ctx.arc(W*0.78, hy-46, 18, 0, Math.PI*2); ctx.fill();
  // 遠景の山（パララックス）
  const off = ((skyOffset*40)%W + W)%W;
  ctx.fillStyle = COL.mountain;
  drawMountains(hy, off);
  // 手前の地面（下半分）— 道路が覆わない部分の緑
  ctx.fillStyle = COL.grassDark;
  ctx.fillRect(0, hy, W, H-hy);
}
function drawMountains(hy, off){
  const w=W, peaks=[[0,0],[40,-30],[85,-8],[130,-40],[180,-14],[230,-34],[280,-6],[320,-26]];
  for(let base=-w; base<=w; base+=w){
    ctx.beginPath();
    ctx.moveTo(base-off, hy);
    for(const p of peaks) ctx.lineTo(base-off+p[0], hy+p[1]);
    ctx.lineTo(base-off+w, hy);
    ctx.closePath(); ctx.fill();
  }
}

// 台形塗り
function polygon(x1,y1,x2,y2,x3,y3,x4,y4,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
  ctx.closePath(); ctx.fill();
}
function fogRect(x,y,w,h,fog){
  if(fog>=1) return;
  ctx.globalAlpha = 1-fog;
  ctx.fillStyle = COL.fog;
  ctx.fillRect(x,y,w,h);
  ctx.globalAlpha = 1;
}

function renderSegment(seg){
  const p1=seg.p1.screen, p2=seg.p2.screen;
  const dark = seg.color==='dark';
  const grass  = dark ? COL.grassDark : COL.grassLight;
  const road   = dark ? COL.roadDark  : COL.roadLight;
  const rumble = dark ? COL.rumbleLight : COL.rumbleWhite;

  const y1=p1.y, y2=p2.y;
  // 草
  ctx.fillStyle=grass;
  ctx.fillRect(0, y2, W, y1-y2);

  const r1 = p1.w/Math.max(6, (2+lanes*2)) + p1.w*0.04, r2 = p2.w/Math.max(6,(2+lanes*2)) + p2.w*0.04;
  const l1 = p1.w/(lanes*8), l2 = p2.w/(lanes*8);

  // 縁石
  polygon(p1.x-p1.w-r1, y1, p1.x-p1.w, y1, p2.x-p2.w, y2, p2.x-p2.w-r2, y2, rumble);
  polygon(p1.x+p1.w+r1, y1, p1.x+p1.w, y1, p2.x+p2.w, y2, p2.x+p2.w+r2, y2, rumble);
  // 路面
  polygon(p1.x-p1.w, y1, p1.x+p1.w, y1, p2.x+p2.w, y2, p2.x-p2.w, y2, road);
  // レーンライン（明色セグメントのみ）
  if(!dark){
    const lw1 = p1.w*2/lanes, lw2 = p2.w*2/lanes;
    let lx1 = p1.x - p1.w + lw1, lx2 = p2.x - p2.w + lw2;
    for(let ln=1; ln<lanes; ln++){
      polygon(lx1-l1/2, y1, lx1+l1/2, y1, lx2+l2/2, y2, lx2-l2/2, y2, COL.lane);
      lx1+=lw1; lx2+=lw2;
    }
  }
  // スタート/フィニッシュのチェッカー
  if(seg.marker){
    const n=8; const w1=p1.w*2, w2=p2.w*2;
    for(let i=0;i<n;i++){
      const c = (i%2===0)?'#fff':'#111';
      const ax = p1.x-p1.w + w1*i/n,     bx = p1.x-p1.w + w1*(i+1)/n;
      const cx = p2.x-p2.w + w2*(i+1)/n, dxp= p2.x-p2.w + w2*i/n;
      polygon(ax,y1,bx,y1,cx,y2,dxp,y2,c);
    }
  }
  // フォグ
  fogRect(0, y2, W, y1-y2, seg.fog);
}

// F1マシン（後方視点）を procedural 描画
function drawF1(cx, baseY, w, color, tilt){
  const h = w*0.9;
  ctx.save();
  ctx.translate(cx, baseY);
  const t = tilt*w*0.05;
  // 影
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(0, 0, w*0.6, h*0.10, 0, 0, Math.PI*2); ctx.fill();
  // リアタイヤ
  const tw=w*0.24, th=h*0.42;
  ctx.fillStyle='#111';
  ctx.fillRect(-w*0.52, -th, tw, th);
  ctx.fillRect( w*0.52-tw, -th, tw, th);
  ctx.fillStyle='#333';
  ctx.fillRect(-w*0.52, -th*0.7, tw, th*0.18);
  ctx.fillRect( w*0.52-tw, -th*0.7, tw, th*0.18);
  // ボディ
  ctx.fillStyle=color;
  ctx.fillRect(-w*0.22+t, -h*0.55, w*0.44, h*0.5);
  // ノーズ側の絞り
  ctx.fillRect(-w*0.13+t, -h*0.72, w*0.26, h*0.2);
  // コックピット/ヘルメット
  ctx.fillStyle='#101018';
  ctx.fillRect(-w*0.10+t, -h*0.66, w*0.20, h*0.14);
  ctx.fillStyle='#e8e8f0';
  ctx.fillRect(-w*0.06+t, -h*0.63, w*0.12, h*0.09);
  // リアウイング
  ctx.fillStyle='#1c1c22';
  ctx.fillRect(-w*0.5, -h*0.66, w*1.0, h*0.09);
  ctx.fillRect(-w*0.5, -h*0.66, w*0.06, h*0.16);
  ctx.fillRect( w*0.5-w*0.06, -h*0.66, w*0.06, h*0.16);
  // ハイライト
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillRect(-w*0.20+t, -h*0.54, w*0.06, h*0.44);
  ctx.restore();
}

function renderRival(r, seg){
  const scale = seg.p1.screen.scale;
  if(scale===undefined || scale<=0) return;
  const destW = scale * CAR_WORLD_W * W/2;
  if(destW < 2) return;
  // カーブでの微揺れ
  const wob = Math.sin(r.wob + position/2000) * 0.02;
  const spriteX = seg.p1.screen.x + (scale * (r.offset+wob) * roadWidth * W/2);
  const spriteY = seg.p1.screen.y;
  const clip = (seg.clip==null) ? H : seg.clip;
  // 手前の丘に道路が隠れている所では車も隠す（clipより下＝丘の裏は描かない）
  if(spriteY > clip + 1){
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, clip); ctx.clip();
    drawF1(spriteX, spriteY, destW, r.color, 0);
    ctx.restore();
  } else {
    drawF1(spriteX, spriteY, destW, r.color, 0);
  }
}

// コースの見取図＋自機位置（左上のミニマップ）
function renderMinimap(bx, by, size){
  if(!trackMap.length) return;
  // 背景パネル
  ctx.fillStyle='rgba(10,12,20,0.62)';
  ctx.fillRect(bx, by, size, size);
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1;
  ctx.strokeRect(bx+0.5, by+0.5, size-1, size-1);

  const pad = 4, inner = size - pad*2;
  const MX = p => bx + pad + p.x*inner;
  const MY = p => by + pad + p.y*inner;

  // コースの軌跡
  ctx.strokeStyle='#8fa0b8'; ctx.lineWidth=1.5;
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(MX(trackMap[0]), MY(trackMap[0]));
  for(let i=1;i<trackMap.length;i++) ctx.lineTo(MX(trackMap[i]), MY(trackMap[i]));
  ctx.stroke();

  // スタート/フィニッシュ
  ctx.fillStyle='#ffffff';
  ctx.fillRect(MX(trackMap[0])-1.5, MY(trackMap[0])-1.5, 3, 3);

  // 周回位置(0..1) → 軌跡上の点。終点は始点と同一なので (長さ-1) で割り当てる
  const at = t => {
    const L = trackMap.length;
    const u = ((t % 1) + 1) % 1;
    return trackMap[Math.min(L-1, Math.floor(u*(L-1)))];
  };

  // ライバル位置
  ctx.fillStyle='#f0d040';
  for(const r of rivals){
    const rp = at(r.z/trackLength);
    ctx.fillRect(MX(rp)-1, MY(rp)-1, 2, 2);
  }

  // 自機位置（点滅させて目立たせる）
  const pp = at(position/trackLength);
  const blink = (Math.floor(performance.now()/250)%2)===0;
  ctx.fillStyle = blink ? '#ff4040' : '#ff9090';
  ctx.beginPath(); ctx.arc(MX(pp), MY(pp), 2.6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(MX(pp), MY(pp), 2.6, 0, Math.PI*2); ctx.stroke();
}

function renderPlayer(){
  if(state==='title') return;
  const bob = Math.sin(position/segmentLength*0.7 + performance.now()/120)* (speed>0? U.limit(speed/maxSpeed*1.6,0,1.6):0);
  const w = W*0.34;
  const cx = W/2 + steerVis*8;
  const baseY = H*0.92 + bob;
  drawF1(cx, baseY, w, '#e02020', steerVis);
}

// 衝突の火花
const SPARK_COL = ['#ffffff','#fff2a0','#ffd040','#ff8020','#ffb060'];
function spawnSparks(px, py, n){
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + (Math.random()-0.5)*Math.PI*1.5;  // 上方向中心に扇状
    const spd = 70 + Math.random()*220;
    const life = 0.32 + Math.random()*0.4;
    sparks.push({
      x: px + (Math.random()-0.5)*16,
      y: py + (Math.random()-0.5)*10,
      vx: Math.cos(ang)*spd + (Math.random()-0.5)*90,
      vy: Math.sin(ang)*spd,
      life, maxLife: life,
      color: SPARK_COL[(Math.random()*SPARK_COL.length)|0],
      size: 1 + ((Math.random()*3)|0)
    });
  }
}
function renderSparks(){
  if(!sparks.length) return;
  for(const s of sparks){
    const a = Math.max(0, s.life/s.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = s.color;
    const sz = s.size;
    ctx.fillRect(s.x - sz/2, s.y - sz/2, sz, sz);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  HUD / オーバーレイ
// ============================================================
function fmtTime(t){
  if(t<0)t=0;
  const m=Math.floor(t/60), s=Math.floor(t%60), ms=Math.floor((t*100)%100);
  return (m>0? m+"'" : "") + String(s).padStart(2,'0') + '"' + String(ms).padStart(2,'0');
}
function pxText(txt, x, y, size, color, align){
  ctx.font = 'bold '+size+'px "Courier New", monospace';
  ctx.textAlign = align||'left';
  ctx.textBaseline='alphabetic';
  ctx.fillStyle='#000'; ctx.fillText(txt, x+1, y+1);
  ctx.fillStyle=color;  ctx.fillText(txt, x, y);
}
function panel(x,y,w,h){
  ctx.fillStyle='rgba(10,12,20,0.65)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1;
  ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}

function renderHUD(){
  // 結果画面は情報を重ねず、専用レイアウトのみ見せる
  if(state==='title' || state==='select' || state==='finish' || state==='gameover') return;
  const kmh = Math.round(speed/maxSpeed * 300);

  const laps = course().laps || TOTAL_LAPS;

  // 上段: LAP / TIME LEFT / PASS
  panel(4,4,W-8,22);
  pxText('LAP '+Math.min(lap,laps)+'/'+laps, 10, 20, 11, '#ffe040');
  const tl = timeLeft;
  const tcol = tl<10 ? (Math.floor(tl*4)%2? '#ff4040':'#ffffff') : '#ffffff';
  pxText('TIME '+Math.ceil(tl), W/2, 20, 12, tcol, 'center');
  pxText('PASS '+passed, W-10, 20, 11, '#8fe0ff', 'right');

  // 左上: コースの見取図＋自機位置
  renderMinimap(6, 30, 56);
  pxText(course().name, 6, 97, 9, '#b8c4d4');

  // 下段左: スピード
  panel(4, H-34, 96, 30);
  pxText(String(kmh).padStart(3,' '), 12, H-14, 18, '#ffffff');
  pxText('km/h', 62, H-12, 9, '#9fb0c8');
  // ギア
  panel(H-34>0?104:104, H-34, 62, 30);
  pxText('GEAR', 110, H-24, 8, '#9fb0c8');
  pxText(gearHigh?'HIGH':'LOW', 110, H-11, 12, gearHigh?'#ff8030':'#40c0ff');

  // 下段右: ラップタイム
  panel(W-92, H-34, 88, 30);
  pxText('LAP '+fmtTime(raceTime-lapStart), W-10, H-22, 10, '#ffffff', 'right');
  pxText('BEST '+ (bestLap? fmtTime(bestLap):'--'), W-10, H-9, 9, '#7fe0a0', 'right');
}

function centerBox(){
  ctx.fillStyle='rgba(0,0,10,0.82)'; ctx.fillRect(0,0,W,H);
}

function renderTitle(){

// コース選択画面（ベストラップも表示）
function renderSelect(){
  ctx.fillStyle='#0a0c14'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<W/10+1;i++){ ctx.fillStyle=(i%2)?'#111':'#eee'; ctx.fillRect(i*10, 8, 10, 6); }
  pxText('SELECT COURSE', W/2, 34, 18, '#ffffff', 'center');

  const bests = loadBests();
  const top = 48, rowH = 30;
  for(let i=0;i<COURSES.length;i++){
    const c = COURSES[i], y = top + i*rowH, sel = (i===selIndex);
    if(sel){
      ctx.fillStyle='rgba(224,32,32,0.30)'; ctx.fillRect(4, y-11, W-8, rowH-4);
      ctx.strokeStyle='#e02020'; ctx.lineWidth=1; ctx.strokeRect(4.5, y-10.5, W-9, rowH-5);
    }
    pxText(sel?'>':' ', 10, y, 12, '#ffd040');
    pxText(c.name, 22, y, 13, sel?'#ffffff':'#9fb0c8');
    pxText(c.desc, 22, y+11, 8, '#7f8ba0');
    // 見取図プレビュー（全コース分を薄く、選択中は明るく）
    if(courseMaps[i] && courseMaps[i].length){
      drawMapPath(courseMaps[i], W-118, y-10, 26, sel?'#e8eef8':'#5a6472');
    }
    // ベストラップ
    const b = bests[c.id];
    pxText('BEST', W-8, y-2, 9, '#7f8ba0', 'right');
    pxText(b? fmtTime(b) : '--', W-8, y+10, 11, b?'#7fe0a0':'#5a6472', 'right');
  }
  pxText('UP/DOWN: SELECT    ENTER: START', W/2, H-14, 9, '#9fb0c8', 'center');
}

// 任意の軌跡データを小さく描く（コース選択のプレビュー用）
function drawMapPath(pts, bx, by, size, color){
  if(!pts.length) return;
  const pad=2, inner=size-pad*2;
  ctx.strokeStyle=color||'#8fa0b8'; ctx.lineWidth=1;
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(bx+pad+pts[0].x*inner, by+pad+pts[0].y*inner);
  for(let i=1;i<pts.length;i++) ctx.lineTo(bx+pad+pts[i].x*inner, by+pad+pts[i].y*inner);
  ctx.stroke();
}

function renderCountdown(){
  const n = Math.ceil(countdown);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,W,H);
  if(n>0){
    const s = 1 + (countdown - Math.floor(countdown)); // 拡大アニメ
    pxText(String(n), W/2, H/2+18, Math.round(56*s), n===1?'#ff5030':'#ffffff', 'center');
  }else{
    pxText('GO!', W/2, H/2+18, 64, '#40ff60', 'center');
  }
}

// 順位を 1st / 2nd / 3rd / 4th ... で表す（低解像度でも読める英字表記）
function ordinal(n){
  const s=['th','st','nd','rd'], v=n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

function renderGameOver(){

// ============================================================
//  メインループ
// ============================================================
let last = performance.now();
function frame(now){
  let dt = (now-last)/1000;
  last = now;
  if(dt>0.05) dt=0.05;                 // タブ復帰などのスパイク抑制
  update(dt);
  render();
  requestAnimationFrame(frame);
}
// 全コースの見取図を先に計算しておく（選択画面のプレビュー用）
function precomputeCourseMaps(){
  const saved = courseIndex;
  courseMaps = COURSES.map((c,i)=>{ courseIndex = i; buildTrack(); return trackMap; });
  courseIndex = saved;
  buildTrack();    // 選択中コースの状態に戻す
}
precomputeCourseMaps();   // タイトル背景用のトラックもここで構築される
requestAnimationFrame(frame);

// タブ復帰時にタイマー基準をリセット（大きなdtスパイク防止）
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) last = performance.now(); });

})();
</script>
